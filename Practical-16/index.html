
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>
<body>

    <h2>Student Marks Calculator</h2>

    <label>Subject 1:</label>
    <input type="number" id="m1" min="0" max="100">
    <br><br>

    <label>Subject 2:</label>
    <input type="number" id="m2" min="0" max="100">
    <br><br>

    <label>Subject 3:</label>
    <input type="number" id="m3" min="0" max="100">
    <br><br>

    <label>Subject 4:</label>
    <input type="number" id="m4" min="0" max="100">
    <br><br>

    <label>Subject 5:</label>
    <input type="number" id="m5" min="0" max="100">
    <br><br>

    <button onclick="calculate()">Calculate Result</button>

    <h3 id="result"></h3>

    <script>

        function calculate() {

            var a = Number(document.getElementById("m1").value);
            var b = Number(document.getElementById("m2").value);
            var c = Number(document.getElementById("m3").value);
            var d = Number(document.getElementById("m4").value);
            var e = Number(document.getElementById("m5").value);

            if (a < 0 || a > 100 || b < 0 || b > 100 ||
                c < 0 || c > 100 || d < 0 || d > 100 ||
                e < 0 || e > 100 ||
                document.getElementById("m1").value === "" ||
                document.getElementById("m2").value === "" ||
                document.getElementById("m3").value === "" ||
                document.getElementById("m4").value === "" ||
                document.getElementById("m5").value === "") {

                document.getElementById("result").innerHTML =
                "Please enter marks between 0 and 100 in all subjects.";

                return;
            }

            var total = a + b + c + d + e;
            var percentage = total / 5;
            var grade;

            if (a < 35 || b < 35 || c < 35 || d < 35 || e < 35) {
                grade = "Fail";
            }
            else if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "E";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + "/500" + "<br>" +
                "Percentage: " + percentage.toFixed(2) + "%" + "<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
